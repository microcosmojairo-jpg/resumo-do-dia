name: Resumo das 6h

on:
  schedule:
    # 6:07, 6:22 e 6:37 na Bahia (UTC-3). O GitHub às vezes atrasa muito;
    # a primeira que rodar gera o resumo e as outras só conferem e saem.
    - cron: "7,22,37 9 * * *"
  workflow_dispatch:       # botão "Run workflow" para rodar na hora
    inputs:
      forcar:
        description: "Gerar de novo a edição de hoje (sim/nao)"
        default: "nao"
      so_testar:
        description: "Só testar as fontes, sem publicar (sim/nao)"
        default: "nao"
  push:
    branches: [main]
    paths-ignore: ["dados/**"]   # mudança no app: só republica, sem buscar notícias

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: resumo
  cancel-in-progress: false

jobs:
  resumo:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar as notícias das últimas 24 h
        if: github.event_name != 'push'
        run: |
          pip install --quiet feedparser requests
          python robo/buscar_noticias.py
        env:
          FORCAR: ${{ github.event.inputs.forcar }}
          SO_TESTAR: ${{ github.event.inputs.so_testar }}

      - name: Guardar o resumo no repositório
        if: github.event_name != 'push'
        run: |
          git config user.name "robo-resumo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados
          git diff --cached --quiet || git commit -m "Resumo de $(TZ=America/Bahia date +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar o app
        id: publicar
        uses: actions/deploy-pages@v4
